name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 3.11 is the floor declared in pyproject.toml, and it is tested as such:
    # the suite happening to pass on an older interpreter is accidental
    # compatibility, not a promise, and never a reason to widen the contract.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m compileall src scripts tests
      - name: versions in lockstep
        run: python3 scripts/bump.py --check
      - name: unit tests
        run: python -m unittest discover tests -v
      - name: the demo must link what it claims
        run: |
          python3 scripts/split.py --register examples/FINDINGS.example.md --out /tmp/v --prefix RES
          python3 scripts/symbols.py --repo examples/demo-project --backend scan --out /tmp/s.json
          python3 scripts/link.py --vault /tmp/v --symbols /tmp/s.json
          python3 scripts/link.py --vault /tmp/v --symbols /tmp/s.json --check

  wheel:
    # What we would publish, exercised the way a user gets it: built as a
    # wheel, installed into a clean venv, run from outside the checkout so a
    # green result cannot come from the working tree.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: build, install and smoke-test the wheel
        run: sh scripts/smoke_wheel.sh python
