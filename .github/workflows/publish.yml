name: publish

# Publishes tracelink-vault to PyPI via trusted publishing (no stored token).
# Triggered by version tags only; tests gate the upload.
# One-time setup on pypi.org is documented in RELEASING.md.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: versions in lockstep
        run: python3 scripts/bump.py --check
      - name: tag matches package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(python3 scripts/bump.py --print)" \
            || { echo "tag $GITHUB_REF_NAME does not match package version"; exit 1; }
      - name: unit tests
        run: python -m unittest discover tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
