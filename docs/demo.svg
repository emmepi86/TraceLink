<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .bg    { fill: #0d1117; }
    .chrome{ fill: #161b22; }
    .dot1  { fill: #ff5f57; } .dot2 { fill: #febc2e; } .dot3 { fill: #28c840; }
    text   { font-size: 13px; }
    .dim   { fill: #6e7681; }
    .cmd   { fill: #58a6ff; }
    .flag  { fill: #79c0ff; }
    .ok    { fill: #3fb950; }
    .out   { fill: #c9d1d9; }
    .warn  { fill: #d29922; }
    .title { fill: #8b949e; font-size: 11px; letter-spacing: .08em; }

    /* 4 screens, 16s loop, 4s each. Each is visible for ~23% of the cycle
       (3.5s) and hidden for the rest — with 62% they overlapped three deep. */
    .step { opacity: 0; animation: show 16s infinite; }
    .s1 { animation-delay:  0s; }
    .s2 { animation-delay:  4s; }
    .s3 { animation-delay:  8s; }
    .s4 { animation-delay: 12s; }
    @keyframes show {
      0%   { opacity: 0 }
      2%   { opacity: 1 }
      22%  { opacity: 1 }
      24%  { opacity: 0 }
      100% { opacity: 0 }
    }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect class="bg" width="760" height="430" rx="10"/>
  <rect class="chrome" width="760" height="34" rx="10"/>
  <rect class="chrome" y="24" width="760" height="10"/>
  <circle class="dot1" cx="20" cy="17" r="5.5"/>
  <circle class="dot2" cx="39" cy="17" r="5.5"/>
  <circle class="dot3" cx="58" cy="17" r="5.5"/>
  <text class="title" x="380" y="21" text-anchor="middle">tracelink</text>

  <!-- step 1 : split -->
  <g class="step s1">
    <text x="24" y="72"><tspan class="dim">$ </tspan><tspan class="cmd">python3 scripts/split.py</tspan></text>
    <text x="24" y="94" class="flag">     --register FINDINGS.md --out vault/ --prefix RES</text>
    <text x="24" y="128" class="out">2 notes -&gt; vault/</text>
    <text x="24" y="150" class="dim">  closed=1  open=1</text>

    <text x="24" y="196" class="title">ONE FILE PER FINDING — THE REGISTER IS NEVER TOUCHED</text>
    <text x="24" y="224" class="out">vault/</text>
    <text x="24" y="246" class="out">├─ <tspan class="ok">RES-01.md</tspan>   <tspan class="dim">frontmatter · [[wikilinks]] · all its sections</tspan></text>
    <text x="24" y="268" class="out">├─ <tspan class="ok">RES-02.md</tspan></text>
    <text x="24" y="290" class="out">└─ <tspan class="ok">INDEX.md</tspan>    <tspan class="dim">status · severity · open+high first</tspan></text>

    <text x="24" y="336" class="warn">status comes from each finding's own headings, never its body</text>
    <text x="24" y="358" class="dim">a note saying "caused a withdrawn finding (X-16)" is not itself withdrawn</text>
  </g>

  <!-- step 2 : symbols -->
  <g class="step s2">
    <text x="24" y="72"><tspan class="dim">$ </tspan><tspan class="cmd">python3 scripts/symbols.py</tspan></text>
    <text x="24" y="94" class="flag">     --repo ./src --out symbols.json</text>
    <text x="24" y="128" class="out">642 symbols via <tspan class="ok">graphify</tspan> -&gt; symbols.json</text>

    <text x="24" y="174" class="title">ONE QUESTION: WHERE DOES THIS NAME LIVE</text>
    <text x="24" y="204" class="out"><tspan class="ok">graphify</tspan>  <tspan class="dim">graph.json — call edges, communities, SQL tables</tspan></text>
    <text x="24" y="226" class="out"><tspan class="ok">ctags</tspan>     <tspan class="dim">tags file — ubiquitous, stable, no dependency</tspan></text>
    <text x="24" y="248" class="out"><tspan class="ok">scan</tspan>      <tspan class="dim">built-in — 10 languages, always available</tspan></text>

    <text x="24" y="300" class="dim">tried in order, first one that answers wins</text>
    <text x="24" y="336" class="warn">pluggable on purpose</text>
    <text x="24" y="358" class="dim">coupling to one upstream schema is how a small tool breaks</text>
  </g>

  <!-- step 3 : link -->
  <g class="step s3">
    <text x="24" y="72"><tspan class="dim">$ </tspan><tspan class="cmd">python3 scripts/link.py</tspan></text>
    <text x="24" y="94" class="flag">     --vault vault/ --symbols symbols.json</text>
    <text x="24" y="128" class="out">forward:  <tspan class="ok">28/31</tspan> notes linked</text>
    <text x="24" y="150" class="out">backward: <tspan class="ok">96</tspan> symbols -&gt; vault/CODE-INDEX.md</text>

    <text x="24" y="196" class="title">EVERY NOTE NOW POINTS AT THE CODE IT NAMES</text>
    <text x="24" y="226" class="out">## Linked code</text>
    <text x="24" y="252" class="out">- <tspan class="ok">`parse_payload`</tspan> <tspan class="dim">— src/ingest/parser.py:L88</tspan></text>
    <text x="24" y="274" class="out">- <tspan class="ok">`ingest_batch`</tspan>  <tspan class="dim">— src/ingest/batch.py:L142</tspan></text>

    <text x="24" y="336" class="warn">linking is lexical</text>
    <text x="24" y="358" class="dim">it finds symbols a note spells out, not prose that talks around them</text>
  </g>

  <!-- step 4 : the reverse -->
  <g class="step s4">
    <text x="24" y="72" class="title">AND THE DIRECTION NOTHING ELSE ANSWERS</text>
    <text x="24" y="104" class="out">vault/CODE-INDEX.md</text>

    <text x="24" y="152" class="dim">| symbol            | location              | notes</text>
    <text x="24" y="176" class="out">| <tspan class="ok">`parse_payload`</tspan>   | <tspan class="dim">parser.py:L88</tspan>         | <tspan class="cmd">[[RES-01]] [[RES-07]] [[RES-11]]</tspan></text>
    <text x="24" y="200" class="out">| <tspan class="ok">`ingest_batch`</tspan>    | <tspan class="dim">batch.py:L142</tspan>         | <tspan class="cmd">[[RES-02]]</tspan></text>
    <text x="24" y="224" class="out">| <tspan class="ok">`retry_window`</tspan>    | <tspan class="dim">retry.py:L31</tspan>          | <tspan class="cmd">[[RES-04]] [[RES-09]]</tspan></text>

    <text x="24" y="278" class="out">given a function, what has already been discovered about it</text>
    <text x="24" y="308" class="warn">three notes on one function is a signal worth seeing</text>

    <text x="24" y="368" class="dim">$ <tspan class="caret">▊</tspan></text>
  </g>
</svg>
